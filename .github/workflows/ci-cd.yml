name: Django CI/CD Pipeline with Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -t my-django-app:latest .

      - name: Run Tests in Docker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_KEY }}
          SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET }}
          SOCIAL_AUTH_GOOGLE_OAUTH2_REDIRECT_URI: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_REDIRECT_URI }}
        run: |
          docker run --env-file .env my-django-app:latest python manage.py test

      - name: Deploy to Render
        if: success()  # Only deploy if tests pass
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
